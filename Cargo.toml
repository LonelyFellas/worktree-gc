[package]
name = "wtgc"
version = "0.1.10"
edition = "2024"
rust-version = "1.95"
description = "Reclaim disk space from git worktrees left behind by AI coding agents — safely."
license = "MIT OR Apache-2.0"
repository = "https://github.com/LonelyFellas/worktree-gc"
keywords = ["git", "worktree", "disk", "cleanup", "agent"]
categories = ["command-line-utilities", "development-tools"]
# gui/ 是独立的 Tauri crate，不属于本包。不排除的话 cargo 会把 src-tauri 的源文件
# 算进来，而它们依赖 tauri——一个 CLI 不该为了 GUI 去编译整套 webview 工具链。
exclude = ["gui"]

[[bin]]
name = "wtgc"
path = "src/main.rs"

[lib]
name = "wtgc"
path = "src/lib.rs"

[features]
# 测试夹具（真 git 造仓）。集成测试通过下面的 self dev-dependency 打开它。
testkit = ["dep:tempfile"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
fs4 = "1.1.0"
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
thiserror = "2.0.20"
tempfile = { version = "3.27.0", optional = true }
wait-timeout = "0.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# 自依赖以打开 testkit：集成测试是外部 crate，看不到 #[cfg(test)] 的模块
wtgc = { path = ".", features = ["testkit"] }
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
tempfile = "3.27.0"

[lints.clippy]
# 这个工具的失败模式是「把错误当成干净」。以下几个 API 一写就是 fail-open 的形状，
# 在判定路径上一律禁止——错误必须显式映射为 Unknown。见 docs/design.md 的 D7。
unwrap_used = "deny"
expect_used = "warn"
