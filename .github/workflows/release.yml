name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify tag matches release versions
        shell: bash
        run: |
          crate_version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          gui_crate_version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' gui/src-tauri/Cargo.toml)
          gui_package_version=$(node -p "require('./gui/package.json').version")
          gui_tauri_version=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          mcp_package_version=$(node -p "require('./mcp/package.json').version")
          plugin_version=$(node -p "require('./plugins/worktree-gc/.codex-plugin/plugin.json').version.split('+')[0]")
          for version in "$crate_version" "$gui_crate_version" "$gui_package_version" "$gui_tauri_version" "$mcp_package_version" "$plugin_version"; do
            test "v$version" = "$GITHUB_REF_NAME"
          done
      - name: Rust quality gates
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: MCP quality gates
        run: |
          npm install --global pnpm@10.33.0
          pnpm --dir mcp install --frozen-lockfile
          pnpm --dir mcp check
          git diff --exit-code -- plugins/worktree-gc
      - name: GUI frontend quality gate
        run: |
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui build

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            exe: ""
          - os: macos-15-intel
            label: macos-x86_64
            exe: ""
          - os: macos-14
            label: macos-aarch64
            exe: ""
          - os: windows-latest
            label: windows-x86_64
            exe: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build CLI
        run: cargo build --release --locked --bin wtgc
      - name: Package CLI and self-contained Codex marketplace
        shell: bash
        run: |
          set -euo pipefail
          cli_root="dist/worktree-gc-${{ matrix.label }}"
          codex_root="dist/worktree-gc-codex-${{ matrix.label }}"
          mkdir -p "$cli_root" "$codex_root/.agents/plugins" "$codex_root/plugins/worktree-gc/bin"
          cp "target/release/wtgc${{ matrix.exe }}" "$cli_root/"
          cp README.md README.zh-CN.md LICENSE-MIT LICENSE-APACHE "$cli_root/"
          cp .agents/plugins/marketplace.json "$codex_root/.agents/plugins/"
          cp -R plugins/worktree-gc/. "$codex_root/plugins/worktree-gc/"
          cp "target/release/wtgc${{ matrix.exe }}" "$codex_root/plugins/worktree-gc/bin/"
          tar -C dist -czf "dist/worktree-gc-${{ matrix.label }}.tar.gz" "worktree-gc-${{ matrix.label }}"
          tar -C dist -czf "dist/worktree-gc-codex-${{ matrix.label }}.tar.gz" "worktree-gc-codex-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  gui-build:
    name: Build GUI ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            target: aarch64-apple-darwin
            bundles: dmg
            artifacts: gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            bundles: dmg
            artifacts: gui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifacts: |
              gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifacts: |
              gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install GUI dependencies
        run: pnpm --dir gui install --frozen-lockfile
      - name: Test macOS GUI backend
        if: matrix.label == 'macos-aarch64'
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --all-targets --locked
      - name: Build unsigned GUI installers
        run: pnpm --dir gui tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: release-gui-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, gui-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
